name: panel

on:
  pull_request:
    paths: ["blue-team/panel/**", ".github/workflows/panel.yml"]
  push:
    branches: [Prueba1, main]
    paths: ["blue-team/panel/**", ".github/workflows/panel.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blue-team/panel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: blue-team/panel/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blue-team/panel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blue-team/panel/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: blue-team/panel
    steps:
      - uses: actions/checkout@v4
      - name: Arrancar en modo demo
        run: |
          cp .env.example .env
          sed -i 's|^ADMIN_PASSWORD=$|ADMIN_PASSWORD=Ci-Panel-Pass-2026|' .env
          docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -skf https://localhost:8443/ > /dev/null
          curl -skf https://localhost:8443/api/health
          curl -sk -c cj -H 'Origin: https://localhost:8443' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Ci-Panel-Pass-2026"}' https://localhost:8443/api/auth/login -f
          curl -skf -b cj https://localhost:8443/api/dashboard/summary | grep -q '"score"'
      - if: failure()
        run: docker compose logs
